name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 失敗の要約（最後のステップ）が、この実行で書かれた記録だけを見るための開始時刻
      - name: Record start time
        run: echo "CI_STARTED_AT=$(date +%s%3N)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: OpenID discovery URL compatibility (offline, no providers)
        env:
          DOYA_AUTH_COMPAT_EVIDENCE_DIR: /tmp/doya-auth-discovery-compat-evidence
        run: node scripts/security-regression/verify-openid-discovery-compat.cjs
      - name: Save synthetic OpenID discovery compatibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openid-discovery-compat-${{ github.workflow }}-${{ github.sha }}
          path: /tmp/doya-auth-discovery-compat-evidence/
          if-no-files-found: warn
          retention-days: 7

      - name: Prisma generate
        run: npx prisma generate

      - name: Health-check report tests (offline)
        run: npm run test:health-check

      - name: Install PostgreSQL for isolated operation regression
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql poppler-utils

      - name: Native PDF and image dependencies (synthetic input, no providers)
        run: npx tsx --test scripts/regression/native-pdf-image.test.ts

      - name: Satori SVG escaping and production image renderers (synthetic input)
        run: npx tsx --test scripts/regression/native-satori.test.ts

      - name: Save synthetic Satori image evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-satori-${{ github.sha }}
          path: /tmp/doya-native-satori-audit/
          if-no-files-found: ignore
          retention-days: 7

      - name: SEO list activity and pagination (private Unix socket, no providers)
        run: python3 scripts/regression/seo-list-postgres.py

      - name: Expense initial loading continuity and retry guards (offline)
        run: |
          node scripts/security-regression/verify-expense-loading-continuity-mounted.cjs
          DOYA_TEST_STRICT=1 node scripts/security-regression/verify-expense-loading-continuity-mounted.cjs

      - name: Team seats, admissions and paid-result recovery (private Unix socket, synthetic Stripe)
        env:
          DOYA_SEAT_EVIDENCE_DIR: /tmp/doya-seat-regression-evidence
        run: python3 scripts/security-regression/verify-pricing-seat-postgres.py

      - name: Save synthetic team-seat recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-seat-recovery-${{ github.sha }}
          path: /tmp/doya-seat-regression-evidence/
          if-no-files-found: ignore
          retention-days: 7

      - name: Company tool-organization schema safety (private SQL only)
        env:
          DOYA_SEAT_EVIDENCE_DIR: /tmp/doya-company-tool-org-schema-evidence
        run: python3 scripts/security-regression/verify-company-tool-org-schema-postgres.py

      - name: Save private company tool-organization schema evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: company-tool-org-schema-${{ github.sha }}
          path: /tmp/doya-company-tool-org-schema-evidence/
          if-no-files-found: ignore
          retention-days: 7

      - name: Power pack administrator recovery (private SQL and real local JWT, synthetic Stripe)
        env:
          DOYA_POWER_RECOVERY_EVIDENCE_DIR: /tmp/doya-power-recovery-evidence
        run: python3 scripts/security-regression/verify-power-pack-purchase-postgres.py

      - name: Save private power pack recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: power-pack-recovery-${{ github.sha }}
          path: /tmp/doya-power-recovery-evidence/
          if-no-files-found: ignore
          retention-days: 7

      - name: Power pack refund attention (private SQL outbox, synthetic notification transport)
        env:
          DOYA_POWER_RECOVERY_EVIDENCE_DIR: /tmp/doya-power-refund-attention-evidence
        run: python3 scripts/security-regression/verify-power-pack-refund-attention-postgres.py

      - name: Save private refund attention evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: power-pack-refund-attention-${{ github.sha }}
          path: /tmp/doya-power-refund-attention-evidence/
          if-no-files-found: ignore
          retention-days: 7

      - name: AskLink concurrent question edits (private Unix socket, no providers)
        run: python3 scripts/security-regression/verify-asklink-edit-postgres.py

      - name: Shanai storage deletion and concurrent registration (private Unix socket, no providers)
        run: python3 scripts/security-regression/verify-shanai-storage-postgres.py

      - name: Shanai transcription ownership and submission recovery (private Unix socket, no providers)
