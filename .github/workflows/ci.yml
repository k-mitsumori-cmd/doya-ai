name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Record postinstall Prisma schema for repeatability
        run: sha256sum node_modules/.prisma/client/schema.prisma > "$RUNNER_TEMP/prisma-postinstall.sha256"

      - name: Prisma generate
        run: |
          node scripts/prisma/generate.cjs
          sha256sum node_modules/.prisma/client/schema.prisma > "$RUNNER_TEMP/prisma-explicit.sha256"
          cmp "$RUNNER_TEMP/prisma-postinstall.sha256" "$RUNNER_TEMP/prisma-explicit.sha256"

      - name: Verify actual Prisma generator UTF-8 split repair
        run: node fixtures/verify-prisma-generator-utf8.cjs "$GITHUB_WORKSPACE" --generated

      - name: Verify source-only ER export with a synthetic client
        run: python3 fixtures/verify-er-source-only.py --dependency-root "$GITHUB_WORKSPACE"

      - name: Verify generated ER viewer async and SVG guards
        run: DOYA_ER_GENERATOR="$GITHUB_WORKSPACE/scripts/architecture/make-er-html.py" DOYA_ER_EXPECT=after node scripts/architecture/fixtures/verify-er-viewer-functions.cjs

      - name: Export exact source-only ER inputs after fresh Prisma generate
        run: |
          ER_SHA="$(git rev-parse HEAD)"
          mkdir -p "$RUNNER_TEMP/er-inputs"
          mkdir -p "$RUNNER_TEMP/er-export-diagnostics"
          node scripts/architecture/export-er-inputs.cjs \
            --root "$GITHUB_WORKSPACE" \
            --out-dir "$RUNNER_TEMP/er-inputs/$ER_SHA" \
            --diagnostics-dir "$RUNNER_TEMP/er-export-diagnostics/$ER_SHA" \
            --date 2026-10-22

      - name: Preserve exact source-only ER inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: er-inputs-source-only
          if-no-files-found: ignore
          path: ${{ runner.temp }}/er-inputs/*/*

      - name: Preserve ER export failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: er-export-diagnostics
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/er-export-diagnostics/*/source.raw.prisma
            ${{ runner.temp }}/er-export-diagnostics/*/generated.raw.prisma
            ${{ runner.temp }}/er-export-diagnostics/*/source.formatted.prisma
            ${{ runner.temp }}/er-export-diagnostics/*/generated.formatted.prisma
            ${{ runner.temp }}/er-export-diagnostics/*/manifest.json

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: CI regression source paths (offline)
        run: |
          node scripts/security-regression/verify-adimage-analysis-source-paths.cjs
          node scripts/security-regression/verify-ci-source-paths.cjs

      - name: Install PostgreSQL for isolated operation regression
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql

      - name: AskLink creation and expiry regression (private Unix socket)
        run: python3 scripts/security-regression/verify-asklink-creation-postgres.py

      - name: AskLink account storage purge regression (private Unix socket, synthetic storage)
        run: python3 scripts/security-regression/verify-asklink-privacy-postgres.py

      - name: Account ownership and CaseStudy retirement regression (private Unix socket)
        run: python3 scripts/security-regression/verify-account-retirement-postgres.py

      - name: Five-service owner transfer and recovery (private Unix PostgreSQL)
        env:
          DOYA_OWNER_T1_EVIDENCE_DIR: ${{ runner.temp }}/owner-transfer-postgres
        run: python3 scripts/security-regression/verify-owner-transfer-postgres.py

      - name: Preserve owner transfer private PostgreSQL diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-transfer-postgres
          if-no-files-found: ignore
          path: ${{ runner.temp }}/owner-transfer-postgres/

      - name: Account lifecycle unconnected core regression (private Unix socket)
