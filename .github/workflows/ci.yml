          path: /tmp/doya-native-pdf-audit/
          if-no-files-found: ignore
          retention-days: 7

      - name: New service existing paid user backfill (private Unix socket, no external providers)
        run: python3 docs/audits/2026-10-06-all-services-recheck/new-service-backfill-private-postgres-supervise.py

      - name: DoyaSlide operation regression (private Unix socket, synthetic providers)
        run: python3 docs/audits/2026-10-06-all-services-recheck/doyaslide-operation-postgres-supervise.py

      - name: AdImage operation regression (private Unix socket, synthetic stored images)
