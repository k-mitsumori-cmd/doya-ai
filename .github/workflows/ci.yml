name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Install PostgreSQL for isolated operation regression
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql

      - name: DoyaSlide operation regression (private Unix socket, synthetic providers)
        run: python3 docs/audits/2026-10-06-all-services-recheck/doyaslide-operation-postgres-supervise.py

      - name: AdImage operation regression (private Unix socket, synthetic stored images)
        run: python3 docs/audits/2026-10-06-all-services-recheck/adimage-operation-helper-postgres-supervise.py

      - name: AdImage API recovery regression (private Unix socket, synthetic providers)
        run: python3 docs/audits/2026-10-06-all-services-recheck/adimage-operation-api-postgres-supervise.py

      - name: Security and incident regression tests (offline)
        run: npm run test:security

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
