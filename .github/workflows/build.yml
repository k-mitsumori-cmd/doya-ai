name: Build

# PR と main への push で、本番と同じ手順のうち「秘密の値が要らない部分」を確かめる。
# - 既存の CI（ci.yml）は tsc・test:security・lint と DB を使う回帰テストを受け持つ。
#   ここでは、そこに入っていない tsx のテスト（npm run build と同じ一式）と next build を受け持つ。
# - 秘密の値は使わない。ビルドに要る環境変数は、存在しない宛先のダミーにする。
#   本番の DB・外部 API には接続しない。
# - main の保護（Branch protection）で、このジョブと ci.yml の check を merge の必須条件にする想定。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: '--max-old-space-size=6144'
      # ダミー。ビルドとテストは DB に接続しない。存在しない宛先にして、誤って接続しても失敗するようにする
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/ci_dummy
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:1/ci_dummy
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-build-only-not-a-secret
      # 本番で旗に値を入れても、ビルドの中のテストが落ちないことを確かめる（2026-11-08 に AGENT_CHAT_ROLLOUT=preview で本番のビルドが落ちた）
      AGENT_CHAT_ROLLOUT: preview
      UI_PREVIEW_EMAILS: ci-preview@example.test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: OpenID discovery URL compatibility (offline, no providers)
        env:
          DOYA_AUTH_COMPAT_EVIDENCE_DIR: /tmp/doya-auth-discovery-compat-evidence
        run: node scripts/security-regression/verify-openid-discovery-compat.cjs
      - name: Save synthetic OpenID discovery compatibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openid-discovery-compat-${{ github.workflow }}-${{ github.sha }}
          path: /tmp/doya-auth-discovery-compat-evidence/
          if-no-files-found: warn
          retention-days: 7

      - name: Prisma generate
        run: npx prisma generate

      - name: Security regression (flag set)
        run: npm run test:security

      - name: Unit tests (tsx)
        run: |
          npm run test:asklink
          npm run test:popup
          npm run test:syscheck
          npm run test:tenjikai
          npm run test:shanai
          npm run test:income
          npm run test:expense
          npm run test:doyapower
          npm run test:shell
          npm run test:agent
          npm run test:slack
          npm run test:cost
          npm run test:pricing
          npm run test:support-chat
          npm run test:health-check
          npm run test:roles

      - name: Type check
        run: npx tsc --noEmit

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Next build
        run: DOYA_BUILD_NO_WEBPACK_CACHE=1 NODE_OPTIONS=--max-old-space-size=3072 npx next build

      - name: Satori deployment assets
        run: node scripts/regression/check-satori-traces.cjs

      - name: OpenAI deployment modules
        run: node scripts/regression/check-openai-traces.cjs

      - name: Annual report native deployment modules
        run: node scripts/regression/check-annual-report-traces.cjs
